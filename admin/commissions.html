<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Commissions — ALFA SPOT Admin</title>
  <link rel="stylesheet" href="css/admin.css"/>
</head>
<body>
<div class="layout">

  <aside class="sidebar">
    <div class="sidebar-logo"><h2>⚡ ALFA SPOT</h2><span>Admin Panel</span></div>
    <nav class="sidebar-nav">
      <div class="nav-section">Main</div>
      <a href="dashboard.html"   class="nav-item"><span class="icon">📊</span> Dashboard</a>
      <a href="clients.html"     class="nav-item"><span class="icon">👥</span> Clients</a>
      <a href="add-client.html"  class="nav-item"><span class="icon">➕</span> Add Client</a>
      <div class="nav-section">Team</div>
      <a href="team.html"        class="nav-item"><span class="icon">🧑‍💼</span> Team Members</a>
      <a href="commissions.html" class="nav-item active"><span class="icon">💰</span> Commissions</a>
      <div class="nav-section">Website</div>
      <a href="../index.html" target="_blank" class="nav-item"><span class="icon">🌐</span> View Website</a>
    </nav>
    <div class="sidebar-footer"><div class="logout-btn" onclick="logout()"><span>🚪</span> Logout</div></div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="topbar-left">
        <h1>Commissions</h1>
        <p>Track earnings for each team member</p>
      </div>
      <div class="topbar-right">
        <select class="filter-sel" id="memberFilter" onchange="render()">
          <option value="">All Members</option>
        </select>
      </div>
    </div>

    <!-- SUMMARY STATS -->
    <div class="stats-grid" id="statsRow" style="grid-template-columns:repeat(4,1fr)"></div>

    <!-- MEMBER COMMISSION CARDS -->
    <div id="memberCards" style="display:flex;flex-direction:column;gap:20px;margin-top:28px"></div>

  </main>
</div>

<script src="js/team-avatars-data.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/db.js"></script>
<script>
guardAuth();

let team = [];

function logout() { localStorage.removeItem('as_loggedIn'); window.location.href='login.html'; }

async function render() {
  const filterMember = document.getElementById('memberFilter').value;
  const data = (await getTeamCommissions()).filter(m => !filterMember || m.id === filterMember);

  const totalRevenue    = data.reduce((s,m) => s + m.totalRevenue, 0);
  const totalCommission = data.reduce((s,m) => s + m.commission, 0);
  const totalClients    = data.reduce((s,m) => s + m.clientCount, 0);

  // Stats
  document.getElementById('statsRow').innerHTML = `
    <div class="stat-card gold">
      <div class="label">Total Revenue (Referred)</div>
      <div class="value">$${totalRevenue}</div>
      <div class="sub">From team-referred clients</div>
    </div>
    <div class="stat-card green">
      <div class="label">Total Commissions Due</div>
      <div class="value">$${totalCommission.toFixed(2)}</div>
      <div class="sub">Across all members</div>
    </div>
    <div class="stat-card blue">
      <div class="label">Clients Referred</div>
      <div class="value">${totalClients}</div>
      <div class="sub">By team members</div>
    </div>
    <div class="stat-card purple">
      <div class="label">Active Members</div>
      <div class="value">${team.filter(m=>m.status!=='inactive').length}</div>
      <div class="sub">Team size</div>
    </div>`;

  // Member cards
  if (!data.length) {
    document.getElementById('memberCards').innerHTML = `<div class="empty-state"><div class="icon">💰</div><p>No team members found.</p></div>`;
    return;
  }

  const pkgBadge = { Starter:'badge-starter', Growth:'badge-growth', Pro:'badge-pro', Custom:'badge-custom' };
  const payBadge = { paid:'badge-paid', partial:'badge-partial', pending:'badge-pending' };

  document.getElementById('memberCards').innerHTML = data.map(m => `
    <div class="card">
      <!-- Member Header -->
      <div style="display:flex;align-items:center;justify-content:space-between;padding:22px 24px;border-bottom:1px solid var(--border)">
        <div style="display:flex;align-items:center;gap:14px">
          ${avatarTag(m.avatar, m.name, 52, 'border-radius:14px')}
          <div>
            <h3 style="font-size:16px;font-weight:700">${m.name}</h3>
            <p style="font-size:12px;color:var(--muted)">${m.role||'Team Member'} · Default: ${m.defaultCommission||0}%</p>
          </div>
        </div>
        <div style="display:flex;gap:24px;text-align:center">
          <div>
            <div style="font-size:22px;font-weight:800;color:var(--gold)">${m.clientCount}</div>
            <div style="font-size:11px;color:var(--muted)">Clients</div>
          </div>
          <div>
            <div style="font-size:22px;font-weight:800;color:var(--success)">$${m.totalRevenue}</div>
            <div style="font-size:11px;color:var(--muted)">Revenue</div>
          </div>
          <div>
            <div style="font-size:22px;font-weight:800;color:var(--info)">$${m.commission.toFixed(2)}</div>
            <div style="font-size:11px;color:var(--muted)">Commission</div>
          </div>
        </div>
      </div>

      <!-- Clients Table -->
      ${m.clients.length ? `
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Client</th>
              <th>Package</th>
              <th>Amount Paid</th>
              <th>Commission %</th>
              <th>Commission $</th>
              <th>Payment</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            ${m.clients.map(c => {
              const commPct = Number(c.commissionPct || m.defaultCommission || 0);
              const commAmt = (Number(c.amountPaid||0) * commPct / 100).toFixed(2);
              return `<tr>
                <td>
                  <div style="display:flex;align-items:center;gap:9px">
                    <div style="width:30px;height:30px;border-radius:7px;background:var(--navy2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--gold)">${initials(c.name)}</div>
                    <div>
                      <div style="font-weight:600;font-size:13px">${c.name}</div>
                      <div style="font-size:11px;color:var(--muted)">${c.company||'—'}</div>
                    </div>
                  </div>
                </td>
                <td><span class="badge ${pkgBadge[c.package]||''}">${c.package}</span></td>
                <td style="color:var(--success);font-weight:600">$${c.amountPaid||0}</td>
                <td>
                  <div style="display:flex;align-items:center;gap:8px">
                    <span class="badge badge-growth">${commPct}%</span>
                    <button class="btn btn-ghost btn-sm" style="padding:4px 10px;font-size:11px" onclick="editCommission('${c.id}','${m.id}',${commPct})">Edit</button>
                  </div>
                </td>
                <td style="color:var(--info);font-weight:700">$${commAmt}</td>
                <td><span class="badge ${payBadge[c.paymentStatus]||''}">${c.paymentStatus}</span></td>
                <td><a href="client.html?id=${c.id}" class="btn btn-ghost btn-sm">View →</a></td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>` : `<div class="empty-state" style="padding:32px"><div class="icon" style="font-size:28px">📋</div><p>No clients referred yet.</p></div>`}
    </div>`).join('');
}

// Edit commission % inline
async function editCommission(clientId, memberId, current) {
  const newPct = prompt(`Commission % for this client:`, current);
  if (newPct === null) return;
  const val = parseFloat(newPct);
  if (isNaN(val) || val < 0 || val > 100) { alert('Enter a valid number between 0 and 100.'); return; }
  await updateClient(clientId, { commissionPct: val });
  await render();
}

async function init() {
  await seedTeamAvatars();

  // Populate filter
  team = await getTeam();
  const sel = document.getElementById('memberFilter');
  team.forEach(m => {
    const o = document.createElement('option');
    o.value = m.id; o.textContent = m.name;
    sel.appendChild(o);
  });

  await render();
}
init();
</script>
</body>
</html>
